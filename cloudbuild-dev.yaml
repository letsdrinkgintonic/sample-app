steps:
# Step 1: Compile the Go application
- name: 'gcr.io/cloud-builders/go'
  id: 'Compile application'
  env: ['GOPATH=/gopath']
  args: ['build', '-o', 'main', 'main.go']

# Step 2: Build Docker image
- name: 'gcr.io/cloud-builders/docker'
  id: 'Build Docker image'
  args:
    [
      'build',
      '-t',
      'us-central1-docker.pkg.dev/$PROJECT_ID/my-repository/hello-cloudbuild:$SHORT_SHA',
      '.'
    ]

# Step 3: Push Docker image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  id: 'Push Docker image'
  args:
    [
      'push',
      'us-central1-docker.pkg.dev/$PROJECT_ID/my-repository/hello-cloudbuild:$SHORT_SHA'
    ]

# Step 4: Deploy to GKE dev namespace
- name: 'gcr.io/cloud-builders/kubectl'
  id: 'Deploy'
  args:
    [
      'apply',
      '-f',
      'dev/deployment.yaml',
      '-n',
      'dev'
    ]
  env:
    - 'CLOUDSDK_COMPUTE_ZONE=us-central1-c'
    - 'CLOUDSDK_CONTAINER_CLUSTER=hello-cluster'

options:
  logging: CLOUD_LOGGING_ONLY
